apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsynced-app
  labels:
    app: cloudsynced-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudsynced-app
  template:
    metadata:
      labels:
        app: cloudsynced-app
    spec:
      initContainers:
        - name: init-config
          image: cloudsynced:1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - "if [ ! -f /data/config.json ]; then cp /app/config.json /data/config.json; fi && chown -R appuser:appuser /data"
          volumeMounts:
            - name: config-storage
              mountPath: /data
      containers:
        - name: cloudsynced
          image: cloudsynced:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: "redis://cloudsynced-redis:6379/0"
            - name: CONFIG_PATH
              value: "/data/config.json"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config-storage
              mountPath: /data
      volumes:
        - name: config-storage
          persistentVolumeClaim:
            claimName: cloudsynced-config-pvc
