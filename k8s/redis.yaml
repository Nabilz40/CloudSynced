apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsynced-redis
  labels:
    app: cloudsynced-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudsynced-redis
  template:
    metadata:
      labels:
        app: cloudsynced-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cloudsynced-redis
spec:
  selector:
    app: cloudsynced-redis
  ports:
    - port: 6379
      targetPort: 6379
